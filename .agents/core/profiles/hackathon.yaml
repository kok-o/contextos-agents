# Profile: Hackathon
# 24-48 hours to ship something impressive

schemaVersion: 2
id: hackathon
name: Hackathon
description: "Ship something impressive in 24-48 hours. No ceremony, just build."

skills:
  required: []
  preferred:
    - react
    - typescript
    - database
  excluded:
    - ddd
    - microservices
    - security
    - testing

policy:
  verification: off
  review: off
  security: off
  adr: off
  testing: off
  accessibility: off

generation:
  documents:
    - TASKS
    - PROJECT_GRAPH

technologyDefaults:
  architecture: single-file
  database: sqlite
  auth: simple-jwt
  hosting: vercel
  orm: prisma

# Legacy v1 fields for backward compatibility
prefer_skills:
  - react
  - typescript
  - database
exclude_skills:
  - ddd
  - microservices
  - security
  - testing
generate_docs:
  - TASKS
  - PROJECT_GRAPH
skip_docs:
  - PRD
  - ARCHITECTURE
  - DATABASE
  - API
  - UI
  - ROADMAP
  - DEPLOYMENT
enforce:
  adr: false
  testing: false
  security_audit: false
  code_review: false
defaults:
  architecture: single-file
  database: sqlite
  auth: simple-jwt
  hosting: vercel
  orm: prisma
