# Profile: MVP
# Minimum viable product — speed is everything

schemaVersion: 2
id: mvp
name: MVP
description: "Ship the fastest possible working version. Cut everything non-essential."

skills:
  required: []
  preferred:
    - database
  excluded:
    - ddd
    - microservices
    - system-design

policy:
  verification: off
  review: off
  security: off
  adr: off
  testing: off
  accessibility: off

generation:
  documents:
    - PRD
    - TASKS
    - PROJECT_GRAPH

technologyDefaults:
  architecture: monolith
  database: sqlite
  auth: simple-jwt
  hosting: vercel
  orm: prisma

# Legacy v1 fields for backward compatibility
prefer_skills:
  - database
exclude_skills:
  - ddd
  - microservices
  - system-design
generate_docs:
  - PRD
  - TASKS
  - PROJECT_GRAPH
skip_docs:
  - ARCHITECTURE
  - DATABASE
  - API
  - UI
  - ROADMAP
  - DEPLOYMENT
enforce:
  adr: false
  testing: false
  security_audit: false
  code_review: false
defaults:
  architecture: monolith
  database: sqlite
  auth: simple-jwt
  hosting: vercel
  orm: prisma
