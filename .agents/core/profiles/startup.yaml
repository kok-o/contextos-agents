# Profile: Startup
# Balanced between speed and quality

schemaVersion: 2
id: startup
name: Startup
description: "Fast iteration with reasonable quality. Ship early, learn fast."

skills:
  required:
    - engineering-workflow
  preferred:
    - docker
    - database
    - security
    - testing
  excluded:
    - ddd
    - microservices

policy:
  verification: recommended
  review: recommended
  security: recommended
  adr: off
  testing: recommended
  accessibility: recommended

generation:
  documents:
    - PRD
    - ARCHITECTURE
    - DATABASE
    - API
    - UI
    - TASKS
    - PROJECT_GRAPH

technologyDefaults:
  architecture: modular-monolith
  database: postgresql
  cache: redis
  auth: jwt
  hosting: vercel-railway
  orm: prisma

# Legacy v1 fields for backward compatibility
prefer_skills:
  - docker
  - database
  - security
  - testing
exclude_skills:
  - ddd
  - microservices
generate_docs:
  - PRD
  - ARCHITECTURE
  - DATABASE
  - API
  - UI
  - TASKS
  - PROJECT_GRAPH
