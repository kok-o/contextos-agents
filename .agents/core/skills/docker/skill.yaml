name: docker
description: Docker containerization, multi-stage builds, non-root security, layer caching optimization, and docker-compose standards.
version: 1.0.0
category: devops
type: instruction-only
requires:
  - security
triggers:
  files:
    - "Dockerfile"
    - "Dockerfile.*"
    - "docker-compose.yml"
    - "docker-compose.yaml"
    - "compose.yml"
    - "compose.yaml"
    - ".dockerignore"
  keywords:
    - "docker"
    - "dockerfile"
    - "container"
    - "docker-compose"
    - "image"
    - "kubernetes"
    - "k8s"
resources:
  - EXAMPLES.md
  - SKILL.md
  - TROUBLESHOOTING.md
  - VALIDATION.json
