schemaVersion: 2
id: security
name: Application Security
description: Protect authentication, authorization, sensitive data, untrusted input, external integrations, and agent tool execution.
category: backend
type: instruction-only
requires: []
optional: [node, fastapi, nestjs]
conflicts: []
weight: 9
resources:
  - EXAMPLES.md
  - SKILL.md
  - TROUBLESHOOTING.md
  - VALIDATION.json
rules:
  - id: SEC-001
    level: must
    enforcement: prompt-guidance
    summary: Always validate and sanitize all user input and untrusted external payloads before processing
  - id: SEC-002
    level: must
    enforcement: runtime
    checker: secret-scanner
    summary: Scan configured inputs for supported credential patterns; report input scope, exclusions, and scanner results
  - id: SEC-003
    level: must
    enforcement: prompt-guidance
    summary: Enforce authentication and authorization checks prior to accessing sensitive resources or data
