name: 'ContextOS Quality Gate'
description: 'Deterministic quality gate verifying skill integrity and preventing adapter drift in consumer projects.'
author: 'kok-o'

inputs:
  version:
    description: 'Exact contextos-agents version to install from the public npm registry, or local for a trusted action checkout'
    required: false
    default: '3.0.0'
  adapters:
    description: 'Target adapter(s) to verify (gemini, claude, cursor, copilot, aider, zed, all)'
    required: false
    default: 'all'
  profile:
    description: 'Profile to verify against (default: current project profile)'
    required: false
    default: ''
  working-directory:
    description: 'Target repository working directory'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  skip-secrets:
    description: '[DEPRECATED] In v1 this defaulted to false. In v2 built-in secret scanning is not_configured until Phase 5. Set to true or omit.'
    required: false
    default: 'true'
  require-secrets:
    description: 'Explicitly require secrets scanning (unsupported in v2 gate; fails closed if true)'
    required: false
    default: 'false'

outputs:
  status:
    description: 'Final gate result status (pass / drift / error)'
    value: ${{ steps.run-gate.outputs.status }}
  code:
    description: 'Exit code of the gate runner (0 for pass, 1 for drift, 2 for error)'
    value: ${{ steps.run-gate.outputs.code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      id: setup-node
      uses: actions/setup-node@v4
      env:
        NODE_OPTIONS: ''
        NODE_PATH: ''
        NODE_EXTRA_CA_CERTS: ''
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run ContextOS Quality Gate
      id: run-gate
      shell: bash
      env:
        CONTEXTOS_ACTION_PATH: ${{ github.action_path }}
        CONTEXTOS_NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
        CONTEXTOS_VERSION: ${{ inputs.version }}
        CONTEXTOS_PROJECT: ${{ inputs.working-directory }}
        CONTEXTOS_ADAPTERS: ${{ inputs.adapters }}
        CONTEXTOS_PROFILE: ${{ inputs.profile }}
        CONTEXTOS_REQUIRE_SECRETS: ${{ inputs.require-secrets }}
        CONTEXTOS_SKIP_SECRETS: ${{ inputs.skip-secrets }}
        # Trusted action configuration; never inherit the consumer's npm registry.
        CONTEXTOS_REGISTRY: https://registry.npmjs.org/
      run: |
        # Resolve setup-node's installation directly, never node/npm/npx from a
        # consumer-controlled PATH. Inputs enter through env, not shell source.
        NODE_VERSION="${CONTEXTOS_NODE_VERSION#v}"
        if [[ ! "$NODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::Cannot locate the setup-node installation'
          exit 2
        fi
        case "$RUNNER_ARCH" in
          X64|x64) ARCH=x64 ;;
          X86|x86) ARCH=x86 ;;
          ARM64|arm64) ARCH=arm64 ;;
          ARM|arm) ARCH=armv7l ;;
          *) echo '::error::Unsupported runner architecture'; exit 2 ;;
        esac
        if [[ "$RUNNER_OS" = Windows ]]; then
          NODE="$RUNNER_TOOL_CACHE/node/$NODE_VERSION/$ARCH/node.exe"
        else
          NODE="$RUNNER_TOOL_CACHE/node/$NODE_VERSION/$ARCH/bin/node"
        fi
        # Remove preloads/options before the first Node process is started.
        # Windows resolves environment names case-insensitively; Bash does not.
        shopt -s nocasematch
        while IFS= read -r VAR; do
          case "$VAR" in
            NODE_*|OPENSSL_CONF|OPENSSL_MODULES|LD_PRELOAD|LD_LIBRARY_PATH|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH)
              unset "$VAR" ;;
          esac
        done < <(compgen -e)
        shopt -u nocasematch
        exec "$NODE" "$CONTEXTOS_ACTION_PATH/run-gate.cjs"
