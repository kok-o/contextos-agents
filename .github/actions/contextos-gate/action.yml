name: 'ContextOS Quality Gate'
description: 'Deterministic quality gate verifying skill integrity and preventing adapter drift in consumer projects.'
author: 'kok-o'

inputs:
  version:
    description: 'Version of contextos-agents package to run (e.g. 2.0.0, latest, or local)'
    required: false
    default: '2.1.1'
  adapters:
    description: 'Target adapter(s) to verify (gemini, claude, cursor, copilot, aider, zed, all)'
    required: false
    default: 'all'
  profile:
    description: 'Profile to verify against (default: current project profile)'
    required: false
    default: ''
  working-directory:
    description: 'Target repository working directory'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  skip-secrets:
    description: '[DEPRECATED] In v1 this defaulted to false. In v2 built-in secret scanning is not_configured until Phase 5. Set to true or omit.'
    required: false
    default: 'true'
  require-secrets:
    description: 'Explicitly require secrets scanning (unsupported in v2 gate; fails closed if true)'
    required: false
    default: 'false'

outputs:
  status:
    description: 'Final gate result status (pass / drift / error)'
    value: ${{ steps.run-gate.outputs.status }}
  code:
    description: 'Exit code of the gate runner (0 for pass, 1 for drift, 2 for error)'
    value: ${{ steps.run-gate.outputs.code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Validate Security Requirements
      shell: bash
      run: |
        if [ "${{ inputs.require-secrets }}" = "true" ] || [ "${{ inputs.skip-secrets }}" = "false" ]; then
          echo "::error::[SECRETS_SCANNER_NOT_CONFIGURED] Secret scanning is not_configured in ContextOS Gate v2.0. To avoid silent security degradation, this check fails closed. Please use a dedicated secrets scanner (e.g. gitleaks/gitleaks-action) in your workflow."
          exit 2
        fi

    - name: Run ContextOS Quality Gate
      id: run-gate
      shell: bash
      run: |
        CMD_ARGS=(gate --project "${{ inputs.working-directory }}" --target "${{ inputs.adapters }}" --github-annotations)
        if [ -n "${{ inputs.profile }}" ]; then
          CMD_ARGS+=(--profile "${{ inputs.profile }}")
        fi

        if [ "${{ inputs.version }}" = "local" ]; then
          RUNNER="node ${{ github.action_path }}/../../../bin/index.js"
        else
          RUNNER="npx --yes contextos-agents@${{ inputs.version }}"
        fi

        set +e
        $RUNNER "${CMD_ARGS[@]}"
        GATE_CODE=$?
        set -e

        if [ $GATE_CODE -eq 0 ]; then
          echo "status=pass" >> $GITHUB_OUTPUT
        elif [ $GATE_CODE -eq 1 ]; then
          echo "status=drift" >> $GITHUB_OUTPUT
        else
          echo "status=error" >> $GITHUB_OUTPUT
        fi
        echo "code=$GATE_CODE" >> $GITHUB_OUTPUT

        exit $GATE_CODE
