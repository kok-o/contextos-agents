name: Installed core package acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: Core archive lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:release-surface:core
      - name: Pack and verify core lifecycle and checkpoint rollback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/release-candidate, scratch/previous-core | Out-Null
          npm pack --ignore-scripts --pack-destination scratch/release-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:consumer:core -- scratch/release-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack contextos-agents@2.3.2 --ignore-scripts --pack-destination scratch/previous-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          npm run check:migration:core -- scratch/previous-core/contextos-agents-2.3.2.tgz "scratch/release-candidate/contextos-agents-$version.tgz"
          exit $LASTEXITCODE
      - name: Retain core archive and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-consumer-${{ matrix.os }}
          path: |
            scratch/release-candidate/*.tgz
            scratch/release-core-install-result.json
            scratch/release-core-migration-result.json
            scratch/release-core-surface.json
