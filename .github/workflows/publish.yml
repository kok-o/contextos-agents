name: Publish reviewed Core stable

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-core-stable-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  prepare:
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - name: Pack the reviewed core archive once
        run: node scripts/publish-release.cjs prepare core-stable
      - uses: actions/upload-artifact@v4
        with:
          name: core-stable-archive-attempt-${{ github.run_attempt }}
          path: |
            scratch/release-candidate/*.tgz
            scratch/release-publish-prepared.json
          if-no-files-found: error
  verify:
    needs: prepare
    name: Core stable acceptance (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - run: npm run validate
      - run: npm run validate:catalog
      - run: npm run check:secrets:core
      - run: npm run test:core
      - run: node --test tests/release-publish.test.js
      - run: npm run test:skills
      - run: npm run lint:md
      - run: npx markdownlint docs/PRODUCT_BOUNDARIES.md docs/ARCHITECTURE.md docs/RELEASE_PROCESS.md docs/RELEASE_3.0.0-rc.1.md --config .markdownlint.json
      - run: node .agents/ctx.js export all --check --json
      - run: npm run check:release-surface:core
      - uses: actions/download-artifact@v4
        with:
          name: core-stable-archive-attempt-${{ github.run_attempt }}
          path: scratch
      - run: node scripts/publish-release.cjs verify core-stable
      - run: npm run check:consumer:core -- scratch/release-candidate
      - name: Verify 2.x upgrade and checkpoint rollback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/previous-core | Out-Null
          npm pack contextos-agents@2.3.2 --ignore-scripts --pack-destination scratch/previous-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          npm run check:migration:core -- scratch/previous-core/contextos-agents-2.3.2.tgz "scratch/release-candidate/contextos-agents-$version.tgz"
          exit $LASTEXITCODE
      - run: node scripts/publish-release.cjs verify core-stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-stable-acceptance-${{ matrix.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: |
            scratch/release-core-install-result.json
            scratch/release-core-migration-result.json
            scratch/release-core-surface.json
  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: core-stable-archive-attempt-${{ github.run_attempt }}
          path: scratch
      - name: Publish only the accepted Core stable archive
        run: node scripts/publish-release.cjs publish core-stable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-stable-publication-attempt-${{ github.run_attempt }}
          path: scratch/release-publish-result.json
  registry:
    needs: publish
    name: Core stable registry acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/publish-release.cjs download core-stable
      - run: npm run check:consumer:core -- scratch/registry-release-candidate
      - name: Confirm the latest distribution tag
        run: node -e "fetch('https://registry.npmjs.org/-/package/contextos-agents/dist-tags').then(r => { if (!r.ok) throw new Error('Registry HTTP ' + r.status); return r.json(); }).then(tags => { if (tags.latest !== require('./package.json').version) throw new Error('latest tag mismatch'); }).catch(e => { console.error(e.message); process.exitCode = 1; });"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-stable-registry-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: scratch/release-core-install-result.json
