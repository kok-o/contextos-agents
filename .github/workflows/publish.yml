name: Publish reviewed core and MCP archives

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-pair
  cancel-in-progress: false

jobs:
  version:
    name: Verify release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag, package, and lockfile versions
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases require a vX.Y.Z tag; got '$TAG'"
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$LOCK_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG, package.json $PACKAGE_VERSION, and package-lock.json $LOCK_VERSION must match"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check:secrets
      - run: npm test

  validate:
    name: Validate and compile (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node .agents/ctx.js export all
      - run: npm run validate
        env:
          NO_COLOR: "1"
      - run: git diff --exit-code

  docs:
    name: Markdown quality
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint:md

  mcp:
    name: Separate MCP beta checks (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
        working-directory: ./contextos-mcp
      - run: npm run lint
        working-directory: ./contextos-mcp
      - run: npm run build
        working-directory: ./contextos-mcp
      - run: npm test
        working-directory: ./contextos-mcp
      - run: npm pack --dry-run
        working-directory: ./contextos-mcp

  installed-consumer:
    needs: version
    uses: ./.github/workflows/consumer-install.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  publish:
    name: Pack and publish core and MCP
    needs: [version, tests, validate, docs, mcp, installed-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm ci --ignore-scripts
        working-directory: ./contextos-mcp
      - run: node --test tests/release-publish.test.js
      - run: npm run build
      - run: npm run build
        working-directory: ./contextos-mcp
      - run: npm run check:release-surface
      - name: Pack both archives and verify reviewed SHA-256 identities
        run: node scripts/publish-release-pair.cjs prepare
      - name: Verify the exact prepared archives in an installed consumer
        run: npm run check:consumer

      - name: Preflight both registry identities and publish missing archives
        run: node scripts/publish-release-pair.cjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Retain prepared archives and publication progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-evidence-attempt-${{ github.run_attempt }}
          path: |
            scratch/release-candidate/*.tgz
            scratch/release-publish-*.json
            scratch/release-install-result.json
            scratch/release-surface.json

      - name: Write release summary
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          MCP_VERSION="$(node -p "require('./contextos-mcp/package.json').version")"
          echo "## Published contextos-agents@${VERSION} and contextos-mcp@${MCP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Version | Link |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| contextos-agents | \`${VERSION}\` | [contextos-agents@${VERSION}](https://www.npmjs.com/package/contextos-agents) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| contextos-mcp | \`${MCP_VERSION}\` | [contextos-mcp@${MCP_VERSION}](https://www.npmjs.com/package/contextos-mcp) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ needs.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests, validation, docs, MCP checks | Passed |" >> "$GITHUB_STEP_SUMMARY"

  registry-acceptance:
    name: Published registry lifecycle (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Download and verify both published archives
        run: node scripts/publish-release-pair.cjs download
      - name: Verify registry installation, upgrade and checkpoint rollback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch/r2-previous | Out-Null
          npm run check:consumer -- scratch/registry-release-candidate 2>&1 | Tee-Object -FilePath scratch/registry-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack contextos-agents@2.2.0 --ignore-scripts --pack-destination scratch/r2-previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack @contextos/mcp@0.3.1 --ignore-scripts --pack-destination scratch/r2-previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:migration -- scratch/r2-previous/contextos-agents-2.2.0.tgz scratch/registry-release-candidate/contextos-agents-2.3.0.tgz scratch/r2-previous/contextos-mcp-0.3.1.tgz 2>&1 | Tee-Object -FilePath scratch/registry-migration.log
          exit $LASTEXITCODE
      - name: Retain registry acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-evidence-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            scratch/registry-release-candidate/*.tgz
            scratch/registry-*.log
            scratch/release-install-result.json
            scratch/release-migration-result.json
