name: Publish stable core package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Verify release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag, package, and lockfile versions
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases require a vX.Y.Z tag; got '$TAG'"
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$LOCK_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG, package.json $PACKAGE_VERSION, and package-lock.json $LOCK_VERSION must match"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check:secrets
      - run: npm test

  validate:
    name: Validate and compile (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node .agents/ctx.js export all
      - run: npm run validate
        env:
          NO_COLOR: "1"
      - run: git diff --exit-code

  docs:
    name: Markdown quality
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint:md

  mcp:
    name: Separate MCP beta checks (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
        working-directory: ./contextos-mcp
      - run: npm run lint
        working-directory: ./contextos-mcp
      - run: npm run build
        working-directory: ./contextos-mcp
      - run: npm test
        working-directory: ./contextos-mcp
      - run: npm pack --dry-run
        working-directory: ./contextos-mcp

  publish:
    name: Pack and publish core
    needs: [version, tests, validate, docs, mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - name: Verify published tarball contents
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const packed = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json', '--ignore-scripts'], { encoding: 'utf8' }))[0];
          const files = packed.files.map(file => file.path);
          if (!files.includes('NOTICE')) throw new Error('NOTICE is missing from the npm package');
          const benchmarks = files.filter(file => file === 'benchmarks' || file.startsWith('benchmarks/'));
          if (benchmarks.length) throw new Error(`Benchmark files must not ship in core: ${benchmarks.join(', ')}`);
          console.log(`Tarball contents verified (${files.length} files).`);
          NODE

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Write release summary
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "## Published contextos-agents@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm | [contextos-agents@${VERSION}](https://www.npmjs.com/package/contextos-agents) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ needs.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests, validation, docs, MCP checks | Passed |" >> "$GITHUB_STEP_SUMMARY"
