# ─────────────────────────────────────────────────────────────────────────────
# validate-skills.yml
# Runs on every PR and push to main.
# Checks:
#   1. Node.js test suite (unit + integration)
#   2. ctx.js validate  — frontmatter, stale, deps, sync
#   3. YAML frontmatter lint  — all SKILL.md files
#   4. Markdown quality lint  — markdownlint-cli (zero deps install)
#   5. registry.json schema   — validates against registry.schema.json
# ─────────────────────────────────────────────────────────────────────────────

name: Validate Skills

on:
  workflow_dispatch:
    inputs:
      core_stable_preflight:
        description: 'Verify one reviewed stable core archive on all supported OS/Node combinations, without MCP or publication'
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-stable-archive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_stable_preflight }}
    name: Prepare reviewed stable core archive (no publication)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - name: Pack and verify the reviewed stable core archive
        run: node -e "process.env.RELEASE_TAG = 'v' + require('./package.json').version; require('./scripts/publish-release.cjs').main('prepare', 'core-stable').catch(error => { console.error(error.message); process.exitCode = 1; });"
      - name: Fetch the previous core archive for checkpoint rollback
        run: |
          mkdir -p scratch/previous-core
          npm pack contextos-agents@2.3.2 --ignore-scripts --pack-destination scratch/previous-core
      - uses: actions/upload-artifact@v4
        with:
          name: core-stable-candidate-${{ github.sha }}
          path: |
            scratch/release-candidate/*.tgz
            scratch/previous-core/*.tgz
            scratch/release-publish-prepared.json
          if-no-files-found: error
          overwrite: true

  core-stable-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_stable_preflight }}
    needs: core-stable-archive
    name: Stable core acceptance (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CONTEXTOS_CORE_ONLY_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: core-stable-candidate-${{ github.sha }}
          path: scratch
      - run: npm run build
      - run: git diff --exit-code
      - name: Verify the downloaded reviewed archive
        run: node -e "process.env.RELEASE_TAG = 'v' + require('./package.json').version; require('./scripts/publish-release.cjs').main('verify', 'core-stable').catch(error => { console.error(error.message); process.exitCode = 1; });"
      - run: npm run validate
      - run: npm run validate:catalog
      - run: node scripts/validate-registry.cjs
      - run: npm run check:secrets:core
      - run: npm run test:skills
      - run: npm run lint:md
      - name: Lint stable release instructions
        run: npx --no-install markdownlint docs/PRODUCT_BOUNDARIES.md docs/ARCHITECTURE.md docs/RELEASE_PROCESS.md docs/RELEASE_3.0.0.md --config .markdownlint.json
      - run: node .agents/ctx.js export all --check --json
      - name: Run the complete core test suite
        shell: pwsh
        run: |
          npm run test:core 2>&1 | Tee-Object -FilePath scratch/core-tests.log
          exit $LASTEXITCODE
      - name: Test publication recovery with controlled fixtures
        run: node --test tests/release-publish.test.js
      - run: npm run check:release-surface:core
      - run: npm run check:consumer:core -- scratch/release-candidate
      - name: Verify previous-version upgrade and checkpoint rollback
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          npm run check:migration:core -- scratch/previous-core/contextos-agents-2.3.2.tgz "scratch/release-candidate/contextos-agents-$version.tgz"
          exit $LASTEXITCODE
      - name: Recheck archive integrity after acceptance
        run: node -e "process.env.RELEASE_TAG = 'v' + require('./package.json').version; require('./scripts/publish-release.cjs').main('verify', 'core-stable').catch(error => { console.error(error.message); process.exitCode = 1; });"
      - name: Retain core-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-stable-evidence-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            scratch/core-tests.log
            scratch/release-publish-prepared.json
            scratch/release-core-install-result.json
            scratch/release-core-migration-result.json
            scratch/release-core-surface.json

  installed-consumer:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    uses: ./.github/workflows/consumer-install.yml

  # ───────────────────────────────────────────────────────────────────────────
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: Tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan codebase for secrets and credentials
        run: npm run check:secrets:core

      - name: Run test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch | Out-Null
          npm run test:core 2>&1 | Tee-Object -FilePath scratch/core-tests.log
          exit $LASTEXITCODE

      - name: Test release publication recovery
        env:
          CONTEXTOS_CORE_ONLY_TESTS: "1"
        run: node --test tests/release-publish.test.js

      - name: Retain root test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: scratch/core-tests.log

  # ───────────────────────────────────────────────────────────────────────────
  validate-skills:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: ctx.js validate & drift check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile skills (export all)
        run: node .agents/ctx.js export all

      - name: Check for uncommitted generated file drift
        run: git diff --exit-code

      - name: Run skill validator
        run: |
          node .agents/ctx.js validate
        env:
          NO_COLOR: "1"

  # ───────────────────────────────────────────────────────────────────────────
  lint-frontmatter:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: YAML Frontmatter Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint SKILL.md frontmatter
        # Pure Node.js — no extra deps needed
        run: |
          node - << 'EOF'
          const fs   = require('fs');
          const path = require('path');

          const SKILLS_DIR = path.join('.agents', 'core', 'skills');
          const KNOWN_EMPTY = ['profiles'];

          let errors = 0;

          for (const name of fs.readdirSync(SKILLS_DIR)) {
            if (KNOWN_EMPTY.includes(name)) continue;
            const skillMd = path.join(SKILLS_DIR, name, 'SKILL.md');
            if (!fs.existsSync(skillMd)) continue;

            const content = fs.readFileSync(skillMd, 'utf8');
            if (!content.startsWith('---')) continue;   // no frontmatter — ok

            const closeIdx = content.indexOf('---', 3);
            if (closeIdx === -1) {
              console.error(`::error file=${skillMd}::Unclosed YAML frontmatter (missing closing ---)`);
              errors++;
              continue;
            }

            const fm = content.slice(3, closeIdx);
            if (!fm.match(/^name:\s*.+/m)) {
              console.error(`::error file=${skillMd}::Frontmatter missing required 'name:' field`);
              errors++;
            }
            if (!fm.match(/^description:/m)) {
              console.error(`::error file=${skillMd}::Frontmatter missing required 'description:' field`);
              errors++;
            }
          }

          if (errors > 0) {
            console.error(`\n${errors} frontmatter error(s) found.`);
            process.exit(1);
          } else {
            console.log('All SKILL.md frontmatter is valid.');
          }
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  lint-markdown:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Lint Markdown files
        run: |
          npx --no-install markdownlint \
            --config .markdownlint.json \
            "README.md" \
            "CONTRIBUTING.md" \
            "GUIDE.md" \
            ".agents/core/skills/**/*.md" \
            --ignore ".agents/generated/**" \
            --ignore "CONVENTIONS.md" \
            --ignore ".github/copilot-instructions.md" \
            --ignore node_modules

  # ───────────────────────────────────────────────────────────────────────────
  validate-registry:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: Registry Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate registry.json against schema
        run: node scripts/validate-registry.cjs

  # ───────────────────────────────────────────────────────────────────────────
  validate-contextos-mcp:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: contextos-mcp (Node ${{ matrix.node }} on ${{ matrix.os }}, Lint, Test, Build, Pack Smoke-Test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install MCP dependencies
        working-directory: ./contextos-mcp
        run: npm ci

      - name: Lint MCP package (Biome)
        working-directory: ./contextos-mcp
        run: npm run lint

      - name: Build MCP package (TypeScript)
        working-directory: ./contextos-mcp
        run: npm run build

      - name: Run MCP test suite (Vitest)
        working-directory: ./contextos-mcp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../scratch | Out-Null
          node node_modules/vitest/vitest.mjs run --reporter=default --reporter=json --outputFile=../scratch/mcp-tests.json 2>&1 | Tee-Object -FilePath ../scratch/mcp-tests.log
          exit $LASTEXITCODE

      - name: Retain MCP test logs and skip inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            scratch/mcp-tests.log
            scratch/mcp-tests.json

      - name: Verify npm package dry-run and CLI entry point
        working-directory: ./contextos-mcp
        run: |
          npm pack --dry-run
          node bin/mcp.mjs --help
  mcp-source-regressions:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: MCP source integration regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 tests/resolver-parity.test.js tests/runtime-state-machine.test.js tests/sandbox-execution.test.js tests/transactional-git.test.js tests/verification-reviewer-pipeline.test.js

  # ---------------------------------------------------------------------------
  oci-integration:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.core_stable_preflight }}
    name: OCI Sandbox Integration Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Start mock OCI environment (Docker is pre-installed on ubuntu-latest)
        run: docker --version

      - name: Run verification integration tests
        run: node --test tests/sandbox-execution.test.js
        env:
          CONTEXTOS_REQUIRE_OCI: "1"
